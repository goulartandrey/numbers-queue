services:
  postgres:
    container_name: queue_db
    image: postgres
    ports:
      - '54321:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /data/postgres
    volumes:
      - pg_data:/data/postgres

volumes:
  pg_data:
